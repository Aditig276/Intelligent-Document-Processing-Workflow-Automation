<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Document Processing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #1f2937;
            padding: 35px;
            border-radius: 12px;
            width: 320px;
        }
        input {
            width: 100%;
            padding: 11px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: 0;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Document Processing</h2>
        <p>Sign in to continue</p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <input type="hidden" name="next" value="{{ next }}">

            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
