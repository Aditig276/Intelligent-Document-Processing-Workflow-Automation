
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Document Processing</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .login-box {
            background: #1f2937;
            padding: 35px;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            border: 1px solid #374151;
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            color: #9ca3af;
        }

        input {
            width: 100%;
            padding: 11px;
            margin: 10px 0;
            border: 1px solid #4b5563;
            border-radius: 5px;
            background: #111827;
            color: white;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #2563eb;
            color: white;
            border: 0;
            cursor: pointer;
            border-radius: 5px;
            font-size: 15px;
            font-weight: bold;
        }

        button:hover {
            background: #1d4ed8;
        }

        .errorlist {
            color: #fca5a5;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Document Processing</h2>
        <p>Sign in to continue</p>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <input type="hidden" name="next" value="{{ next }}">

            <button type="submit">Login</button>
        </form>

    </div>

</body>
</html>
